# CI — plantuml-render. The manifest points the grammar dependency at the
# public GitHub mirror; the insteadOf rewrite resolves it against this
# GitLab's own project (same repo, local network, job-token auth).

include:
  - project: deriva/infra/ci-templates
    ref: main
    file:
      - /templates/base.yml
      - /templates/node.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

.git-auth: &git-auth
  - export GIT_CONFIG_GLOBAL="$CI_PROJECT_DIR/.gitconfig-ci"
  - git config --file "$GIT_CONFIG_GLOBAL"
    url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/deriva/plantuml/".insteadOf
    "https://github.com/derivasoftware/"

test:
  stage: test
  extends: [.node-base, .on-mr-and-main]
  script:
    - *git-auth
    - npm ci
    - mkdir -p test-results
    - npm run test:ci

publish:
  stage: deploy
  extends: [.node-base]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - *git-auth
    - npm ci
    - npm run compile
    - echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" > .npmrc
    - npm publish --registry "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/"
    - >
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      --upload-file schema/render-ir.schema.json
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/render-ir/${CI_COMMIT_TAG}/render-ir.schema.json"

# The standalone executables (REQ-00014-1): one per platform, built by bun
# from scripts/standalone.mjs with the grammar wasm, the parser runtime and
# the manual embedded, smoke-tested on the runner, then stored in the generic
# package registry (they exceed the job-artifact size limit); the release
# engineer attaches them to the GitHub release (`gh release upload <tag>
# dist/*`).
binaries:
  stage: deploy
  extends: [.node-base]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - *git-auth
    - npm ci
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$HOME/.bun/bin:$PATH"
    - npm run binaries
    - >
      for f in dist/*; do
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/binaries/${CI_COMMIT_TAG}/$(basename "$f")";
      done
