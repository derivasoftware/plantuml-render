requirement:
  id: REQ-00022-1
  title: Each release shall publish a SHA256 checksum file covering every executable
  description: >
    Each release shall publish a SHA256 checksum file covering every executable
  rationale: >
    Consumers that fetch the executable for their platform automatically
    (GitHub issue #2: docthor downloads plantuml-render on first use and
    caches it instead of vendoring 80 MB) need to verify the file before
    running it; without a published hash they trust the transport alone.
    scripts/checksums.sh writes dist/SHA256SUMS in `sha256sum` format
    (one sorted line per `plantuml-render-*` file) at the end of
    scripts/build_binaries.sh; the tag job stores it with the executables
    in the generic package registry and scripts/release.sh attaches it to
    the GitHub release, so the file is generated by the same build as the
    binaries it describes. A downloader pins a version and runs
    `sha256sum -c SHA256SUMS --ignore-missing` (`shasum -a 256 -c` on
    macOS). A detached signature is a possible later step.
  status: DRAFT
  asil: QM
  parent_ids:
    - SREQ-00001-1
  tags:
    - distribution
    - release
