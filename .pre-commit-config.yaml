repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://gitlab.semantiqa.dev/deriva/plantuml/plantuml-fmt
    rev: v0.3.2
    hooks:
      - id: plantuml-fmt
