repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com/derivasoftware/plantuml-fmt
    rev: v0.3.2
    hooks:
      - id: plantuml-fmt

  - repo: local
    hooks:
      - id: doc-images-tracked
        name: doc images are tracked in git
        language: system
        pass_filenames: false
        entry: >-
          bash -c 'missing=$(grep -hoE "assets/[A-Za-z0-9_.-]+\.(svg|png)"
          doc/*.md 2>/dev/null | sort -u | while read -r a; do git ls-files
          --error-unmatch "doc/$a" >/dev/null 2>&1 || echo "doc/$a"; done);
          if [ -n "$missing" ]; then echo "referenced but untracked:";
          echo "$missing"; exit 1; fi'
